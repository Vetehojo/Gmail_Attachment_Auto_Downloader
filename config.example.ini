# このファイルは配布用の設定サンプル。実際の値は setup.bat の設定GUIが
# config.ini (Gitで管理しない) へ保存する。
[settings]
# oauth: 個人Gmail / 単一Google Workspace
# dwd: Google Workspace Domain-Wide Delegation
auth_mode = oauth
# OAuthモード専用。添付ファイルの保存先フォルダー(絶対パス。ネットワーク共有可)。DWDモードではdwd_accounts側の値を使う。
final_dir = C:\path\to\final
# OAuthモード専用。監視対象のGmailアドレス。DWDモードではdwd_accounts側の値を使う。
target_email = office@example.com
# 確認位置の記録が無いアカウントを何日前まで遡って確認するか(1以上)。reset_last_check.bat 実行後や、あとから追加したDWDアカウントが対象。
# 初回設定では設定GUIで選んだ取込期間が使われる。
lookback_days = 7
# Gmailを確認する間隔(秒)。15未満は15として扱われる。
polling_interval = 60
# 保存ファイル名のテンプレート。使えるプレースホルダー: {original} {date} {subject} {sender}
rename_template = {original}_{date}_{subject}_{sender}
# テンプレート中の{subject}に使う最大文字数(0-200)。
rename_subject_max = 50
# DWDモードのアカウント一覧。setup.batの設定GUIがJSON形式で書き込む(手動編集は非推奨)。
dwd_accounts = []
# 除外するGmailラベル名をカンマ区切りで指定(空欄なら除外なし。例: FAX,税務)
excluded_labels =
# 保存対象とする拡張子をカンマ区切りで指定(先頭のドットは省略可)
allowed_extensions = .pdf,.jpg,.jpeg,.png,.tiff,.doc,.docx,.xls,.xlsx,.xlsm,.ppt,.pptx,.txt,.csv,.zip
